<div [hidden]="!isOpen" class="fixed inset-0 z-50 flex items-center justify-center">

  <!-- Background -->
  <div class="absolute inset-0 bg-black/50"></div>

  <!-- Modal -->
  <div class="relative bg-white rounded-2xl shadow-lg w-full max-w-md p-6 z-10 pointer-events-auto">

    <!-- Título -->
    <h2 class="text-xl font-bold text-gray-800 mb-4">
      {{ title }}
    </h2>

    <!-- Mensagem -->
    <p class="text-gray-600 mb-6">
      {{ message }}
    </p>

    <!-- Botões -->
    <div class="flex justify-end gap-3">

      <button
        type="button"
        (click)="onCancel()"
        class="px-4 py-2 bg-gray-300 hover:bg-gray-400 rounded-lg">
        Cancelar
      </button>

      <button
        type="button"
        (click)="onConfirm()"
        [disabled]="isLoading"
        class="px-4 py-2 bg-red-600 text-white rounded-lg disabled:bg-gray-400">
        Excluir
      </button>

    </div>

  </div>
</div>
