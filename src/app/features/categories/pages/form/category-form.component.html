<h2 class="text-3xl font-bold text-gray-800 mb-8">
  {{
    isViewMode
      ? 'Visualizar Categoria'
      : (form.get('categoryID')?.value ? 'Editar Categoria' : 'Nova Categoria')
  }}
</h2>

<form [formGroup]="form" class="space-y-6 max-w-4xl">

    <!-- ID -->
    <!-- <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
            ID da Categoria
        </label>
        <input type="number" formControlName="categoryID"
            class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-blue-500" required />
    </div> -->

    <!-- Nome -->
    <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
            Nome da Categoria
        </label>

        <input 
            type="text" 
            formControlName="categoryName"
            maxlength="30"
            class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-blue-500"
            [class.border-red-500]="form.get('categoryName')?.invalid && form.get('categoryName')?.touched"
        />

        <!-- Mensagens -->
        <div class="text-red-500 text-sm mt-1" *ngIf="form.get('categoryName')?.touched">
            <span *ngIf="form.get('categoryName')?.errors?.['required']">
                Nome é obrigatório
            </span>
            <span *ngIf="form.get('categoryName')?.errors?.['minlength']">
                Mínimo de 3 caracteres
            </span>
            <span *ngIf="form.get('categoryName')?.errors?.['maxlength']">
                Máximo de 30 caracteres
            </span>
        </div>
    </div>

    <!-- Descrição -->
    <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
            Descrição
        </label>

        <textarea 
            formControlName="description"
            rows="5"
            maxlength="200"
            class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-blue-500"
            [class.border-red-500]="form.get('description')?.invalid && form.get('description')?.touched"
        ></textarea>

        <!-- Mensagens -->
        <div class="text-red-500 text-sm mt-1" *ngIf="form.get('description')?.touched">
            <span *ngIf="form.get('description')?.errors?.['required']">
                Descrição é obrigatória
            </span>
            <span *ngIf="form.get('description')?.errors?.['maxlength']">
                Máximo de 200 caracteres
            </span>
        </div>
    </div>

    <!-- Imagem -->
    <!-- <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
            URL da Imagem (opcional)
        </label>
        <input type="url" formControlName="picture"
            class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-blue-500" />
    </div> -->

    <!-- Botões -->
    <div class="flex gap-4 pt-6">

        <button 
            type="button" 
            [routerLink]="['/categories']"
            class="px-6 py-3 rounded-lg bg-gray-500 hover:bg-gray-600 text-white rounded">
            Voltar
        </button>

        <button type="reset" class="px-6 py-3 rounded-lg bg-gray-300 hover:bg-gray-400 font-medium">
            Limpar
        </button>

        <button 
            type="button"
            (click)="save()"
            [disabled]="form.invalid"
            class="px-6 py-3 rounded-lg bg-blue-600 hover:bg-blue-700 text-white font-medium disabled:bg-gray-400">
            Salvar
        </button>

        <button 
            *ngIf="isViewMode"
            [routerLink]="['/categories', form.get('categoryID')?.value]"
            class="px-6 py-3 rounded-lg bg-yellow-500 text-white">
            Editar
        </button>
    </div>

</form>
